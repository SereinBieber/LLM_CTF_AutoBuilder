version: '3'
services:
  misc_service:
    build: ../../../base_images/misc-common
    container_name: ${TASK_ID}_misc
    restart: always
    ports:
      - "${EXPOSED_PORT}:9999"
    volumes:
      # 挂载源码目录
      - ./src:/app
    environment:
      - FLAG=flag{test_flag_default}
    # 核心启动命令：
    # 使用 socat 将 TCP 9999 端口转发给 python server.py
    # python -u 禁止缓冲，防止交互卡死
    command: >
      socat TCP-LISTEN:9999,reuseaddr,fork EXEC:"python -u server.py",stderr
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge