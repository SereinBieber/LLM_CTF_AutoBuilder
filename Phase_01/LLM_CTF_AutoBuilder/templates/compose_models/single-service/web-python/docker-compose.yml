version: '3'
services:
  web:
    # 指向 Python 基础镜像
    build: ../../../base_images/python-flask
    container_name: ${TASK_ID}_web
    restart: always
    ports:
      - "${EXPOSED_PORT}:5000"  # Python Flask 默认 5000
    volumes:
      - ./src:/app
    environment:
      - FLAG=flag{test_flag_default}
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge