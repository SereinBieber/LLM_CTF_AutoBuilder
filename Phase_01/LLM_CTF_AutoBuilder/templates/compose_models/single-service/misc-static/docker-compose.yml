version: '3'
services:
  misc_service:
    image: nginx:alpine
    container_name: ${TASK_ID}_misc
    restart: always
    ports:
      - "${EXPOSED_PORT}:80"
    volumes:
      # 将题目文件挂载到 Nginx 网站根目录
      - ./src:/usr/share/nginx/html
      # 挂载自定义配置文件 (开启目录列表)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge