version: '3'
services:
  db_service:
    build: ../../../base_images/mysql-common
    container_name: ${TASK_ID}_mysql
    restart: always
    ports:
      - "${EXPOSED_PORT}:3306"
    environment:
      # 工程化亮点：弱口令可以由 AI 动态生成并注入，这里做个兜底
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      # 核心机制：将 AI 在 tasks_data 中生成的 .sql 挂载进来自动执行
      - ./data:/docker-entrypoint-initdb.d/
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge