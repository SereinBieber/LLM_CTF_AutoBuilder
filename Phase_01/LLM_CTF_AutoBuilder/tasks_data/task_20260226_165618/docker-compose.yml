version: '3'
services:
  web:
    # 指向 PHP 基础镜像
    build: ../../templates/base_images/php-apache
    container_name: ${TASK_ID}_web
    restart: always
    ports:
      - "${EXPOSED_PORT}:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - FLAG=flag{php_web_challenge_2024}
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge