version: '3'
services:
  web:
    # 指向 PHP 基础镜像
    build: ../../../base_images/php-apache
    container_name: ${TASK_ID}_web
    restart: always
    ports:
      - "${EXPOSED_PORT}:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - FLAG=flag{test_flag_default}
    # 启动时把 FLAG 写入 /flag 文件，供题目读取
    command: >
      sh -c "echo $$FLAG > /flag &&
             chmod 644 /flag &&
             apache2-foreground"
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge
