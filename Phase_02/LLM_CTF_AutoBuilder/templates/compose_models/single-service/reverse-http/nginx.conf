server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;

    # 允许下载二进制文件（无扩展名的ELF也支持）
    location ~* \.(bin|elf|exe|out)$ {
        add_header Content-Disposition 'attachment';
        add_header Content-Type application/octet-stream;
    }

    # 支持下载无扩展名的challenge文件
    location /challenge {
        add_header Content-Disposition 'attachment; filename="challenge"';
        add_header Content-Type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
