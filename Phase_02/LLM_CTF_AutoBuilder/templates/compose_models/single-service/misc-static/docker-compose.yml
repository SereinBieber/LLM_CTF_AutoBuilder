version: '3'
services:
  misc_service:
    image: nginx:alpine
    container_name: ${TASK_ID}_misc
    restart: always
    ports:
      - "${EXPOSED_PORT}:80"
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - FLAG=flag{test_flag_default}
    # 启动时把 FLAG 写入 /flag 文件
    command: >
      sh -c "echo $$FLAG > /flag &&
             chmod 644 /flag &&
             nginx -g 'daemon off;'"
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge
