server {
    listen 80;
    server_name _;

    root /var/www/html;
    autoindex on;

    # 允许下载二进制文件
    location ~* \.(bin|elf|exe|out)$ {
        add_header Content-Disposition 'attachment';
        add_header Content-Type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
